<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPA Market Place</title>
<meta name="description" content="Tempat warga PPA memperkenalkan usahanya. Cari jajanan dan jasa warga, chat langsung lewat WhatsApp.">

<!-- Open Graph: preview saat link ini dibagikan ke WA/grup -->
<meta property="og:type" content="website">
<meta property="og:title" content="PPA Market Place">
<meta property="og:description" content="Tempat warga PPA memperkenalkan usahanya. Cari jajanan dan jasa warga, chat langsung lewat WhatsApp.">
<meta property="og:image" content="images/logo-ppamarketplace.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="PPA Market Place">
<meta name="twitter:description" content="Tempat warga PPA memperkenalkan usahanya.">
<meta name="twitter:image" content="images/logo-ppamarketplace.png">

<link rel="icon" type="image/png" href="images/logo-ppamarketplace.png">
<link rel="apple-touch-icon" href="images/logo-ppamarketplace.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  /* ================================================================
     WARNA & SKEMA DASAR (WARNA MIE GACOAN + PALET KATEGORI)
     ================================================================ */

  :root{
    --bg: #fcfcfb;
    --ink: #1a1a1e;
    --ink-soft: #74747c;
    --line: #e6e6ea;
    --card-bg: #ffffff;

    --pink: #e31c7f;
    --pink-dark: #b91367;
    --pink-soft: #fdeaf3;
    --pink-ink: #a3115e;

    --cyan: #14a7c9;
    --cyan-soft: #e4f6fa;
    --cyan-ink: #0d7a93;

    --amber: #e2a12b;
    --amber-soft: #fbf1de;
    --amber-ink: #8a5a0b;

    --green: #4f9d5c;
    --green-soft: #e8f5ea;
    --green-ink: #2f6b39;

    --shadow-card: 0 1px 2px rgba(20,20,25,0.04);
    --shadow-hover: 0 10px 24px rgba(20,20,25,0.10);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
  }

  a{ color: inherit; }
  button{ font-family: inherit; }

  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .hidden{ display: none !important; }

  /* ---------- Header ---------- */

  /* ---------- Splash singkat ---------- */

  #loading-screen{
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity .35s ease, visibility .35s ease;
  }
  #loading-screen.fade-out{ opacity: 0; visibility: hidden; }

  .loading-logo{
    width: 74px;
    height: auto;
    object-fit: contain;
    animation: pulse 1.1s infinite ease-in-out;
  }

  .loading-text{
    margin-top: 16px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    text-align: center;
    padding: 0 20px;
  }

  @keyframes pulse{
    0%{ transform: scale(1); opacity: .9; }
    50%{ transform: scale(1.08); opacity: 1; }
    100%{ transform: scale(1); opacity: .9; }
  }

  header{
    padding: 18px 0;
  }

  .header-row{
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .site-logo{
    width: auto;
    height: 40px;
    max-width: 120px;
    flex-shrink: 0;
    object-fit: contain;
  }

  .site-title{
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .header-stats{
    margin-left: auto;
    color: var(--ink-soft);
    font-size: 13px;
    white-space: nowrap;
  }

  .daftar-btn{
    text-decoration: none;
    background: var(--ink);
    color: #fff;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
  }

  .daftar-btn:hover{ background: var(--pink); }

  /* ---------- Hero / mood ---------- */

  .hero{
    background: var(--pink-soft);
    border-radius: 22px;
    padding: 30px 26px 26px;
    margin: 4px 0 20px;
  }

  .hero-title{
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .hero-sub{
    margin: 0 0 18px;
    color: var(--ink-soft);
    font-size: 14.5px;
  }

  .mood-options{
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
  }

  .mood-chip{
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 17px;
    border-radius: 999px;
    border: none;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    transition: transform .15s ease, background .15s ease, color .15s ease;
  }

  .mood-chip:hover{ transform: translateY(-1px); }

  .mood-chip.active{
    background: var(--pink);
    color: #fff;
    transform: scale(1.05);
  }

  /* ---------- Filter bar ---------- */

  .filter-bar{
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }

  .filter-bar input[type="text"]{
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    flex: 1;
    min-width: 180px;
  }

  .filter-bar input[type="text"]:focus{ outline: 2px solid var(--pink); outline-offset: 1px; }

  .icon-btn{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    font-weight: 500;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }

  .icon-btn:hover{ border-color: var(--pink); color: var(--pink); }
  .icon-btn.active{ background: var(--ink); color: #fff; border-color: var(--ink); }
  .icon-btn svg{ flex-shrink: 0; }

  .kategori-row{
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 14px 0 6px;
    scrollbar-width: none;
  }
  .kategori-row::-webkit-scrollbar{ display: none; }

  .kat-chip{
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .kat-chip.active{ background: var(--cyan); border-color: var(--cyan); color: #fff; }

  .filter-count{
    color: var(--ink-soft);
    font-size: 13px;
    padding: 10px 0 4px;
  }

  /* ---------- Grid & Kartu Toko ---------- */

  main{ padding-bottom: 60px; }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 18px;
  }

  .card{
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card-bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-card);
    cursor: pointer;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }

  .card:hover{
    box-shadow: var(--shadow-hover);
    transform: translateY(-3px);
    border-color: var(--line);
  }

  .card-photos{
    position: relative;
    height: 180px;
    overflow: hidden;
  }

  .card-photos .track{
    display: flex;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .card-photos .track::-webkit-scrollbar{ display: none; }

  .card-photos .track img{
    flex: 0 0 100%;
    scroll-snap-align: start;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transition: transform .3s ease, filter .4s ease;
    filter: blur(0);
  }

  .card-photos .track img.blur-load{ filter: blur(10px); }

  .card:hover .card-photos .track img{ transform: scale(1.04); }

  .card-photos .nav{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(38,36,32,0.55);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .card-photos .nav.prev{ left: 8px; }
  .card-photos .nav.next{ right: 8px; }

  .card-photos .no-photo{
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14px;
  }

  .badge-stack{
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  .detail-photos .badge-stack{ top: 14px; left: 14px; gap: 8px; }

  .badge-ramai, .badge-baru{
    display: flex;
    align-items: center;
    gap: 4px;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 10px 5px 8px;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }
  .badge-ramai{ background: var(--pink); }
  .badge-baru{ background: var(--green); }
  .badge-ramai svg, .badge-baru svg{ flex-shrink: 0; }
  .detail-photos .badge-ramai, .detail-photos .badge-baru{ font-size: 13px; padding: 6px 12px 6px 10px; }

  .fav-btn{
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 3;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .fav-btn.active{ color: var(--pink); }
  .fav-btn svg{ width: 16px; height: 16px; }

  .detail-photos .fav-btn{ top: 14px; right: 14px; width: 36px; height: 36px; }
  .detail-photos .fav-btn svg{ width: 18px; height: 18px; }

  .card-body{
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .card-top{
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-logo{
    width: 38px;
    height: 38px;
    border-radius: 10px;
    object-fit: cover;
    background-color: #f0f0f0;
    border: 2px solid var(--line);
    flex-shrink: 0;
  }

  .card-logo.fallback{
    background: linear-gradient(135deg, var(--pink), var(--cyan));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 14px;
  }

  .card-name{ font-weight: 600; font-size: 15.5px; }

  .card-tag{
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    width: fit-content;
    font-weight: 600;
  }

  .card-desc{
    font-size: 13.5px;
    color: var(--ink-soft);
    flex: 1;
  }

  .card-actions{
    display: flex;
    gap: 8px;
  }

  .card-wa{
    text-decoration: none;
    text-align: center;
    background: var(--pink);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 0;
    border-radius: 10px;
    flex: 1;
  }

  .card-wa:hover{ background: var(--pink-dark); }

  .card-share{
    width: 38px;
    flex-shrink: 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .card-share:hover{ border-color: var(--ink); color: var(--ink); }

  /* ---------- Skeleton loading ---------- */

  .skeleton-card{
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    background: var(--card-bg);
  }
  .skel{
    background: linear-gradient(100deg, var(--line) 30%, #f2f2f4 50%, var(--line) 70%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer{ 0%{ background-position: 150% 0; } 100%{ background-position: -50% 0; } }
  .skeleton-card .skel-photo{ height: 180px; }
  .skeleton-card .skel-body{ padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .skeleton-card .skel-line{ height: 12px; border-radius: 6px; }
  .skeleton-card .skel-line.w60{ width: 60%; }
  .skeleton-card .skel-line.w40{ width: 40%; }
  .skeleton-card .skel-btn{ height: 34px; border-radius: 10px; margin-top: 4px; }

  /* ---------- Halaman Detail Seller ---------- */

  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    color: var(--ink-soft);
    font-size: 14px;
    margin: 22px 0 16px;
  }

  .back-link:hover{ color: var(--pink); }

  .detail-photos{
    position: relative;
    width: 100%;
    height: 480px;
    border-radius: 18px;
    overflow: hidden;
  }

  .detail-photos .track{
    display: flex;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .detail-photos .track::-webkit-scrollbar{ display: none; }

  .detail-photos .track img{
    flex: 0 0 100%;
    scroll-snap-align: start;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    transition: filter .4s ease;
  }
  .detail-photos .track img.blur-load{ filter: blur(14px); }

  .detail-photos .no-photo{
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
  }

  .detail-photos .dots{
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 6px;
    z-index: 2;
  }

  .detail-photos .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
  }

  .detail-photos .dot.active{ background: var(--ink); }

  .detail-head{
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
  }

  .detail-logo{
    width: 60px;
    height: 60px;
    border-radius: 14px;
    object-fit: cover;
    background-color: #f0f0f0;
    border: 2px solid var(--line);
    flex-shrink: 0;
  }

  .detail-logo.fallback{
    background: linear-gradient(135deg, var(--pink), var(--cyan));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 20px;
  }

  .detail-head h1{
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 25px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .chip-row{
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .detail-desc{
    font-size: 15px;
    color: var(--ink-soft);
    margin: 18px 0;
  }

  .detail-actions{
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
  }

  .detail-wa{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    text-align: center;
    background: var(--pink);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 28px;
    border-radius: 999px;
  }

  .detail-wa:hover{ background: var(--pink-dark); }

  .detail-icon-btn{
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .detail-icon-btn:hover{ border-color: var(--ink); color: var(--ink); }
  .detail-icon-btn.active{ color: var(--pink); border-color: var(--pink); }

  /* ---------- Empty state ---------- */

  .empty{
    border: 1px dashed var(--line);
    border-radius: 18px;
    padding: 50px 20px;
    text-align: center;
    color: var(--ink-soft);
  }

  .empty .empty-emoji{ font-size: 34px; margin-bottom: 10px; }
  .empty p{ margin: 6px 0; }
  .empty .empty-title{ font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 17px; color: var(--ink); }

  .empty-cta{
    display: inline-block;
    text-decoration: none;
    background: var(--ink);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    margin-top: 14px;
  }
  .empty-cta:hover{ background: var(--pink); }

  /* ---------- Footer ---------- */

  footer{
    border-top: 1px solid var(--line);
    padding: 22px 0;
    color: var(--ink-soft);
    font-size: 13px;
  }

  @media (max-width: 480px){
    .site-title{ font-size: 15px; }
    .hero{ padding: 24px 20px 20px; }
    .hero-title{ font-size: 24px; }
    .detail-photos{ height: 340px; }
  }
</style>
</head>
<body>

<div id="loading-screen">
  <img class="loading-logo" src="images/logo-ppamarketplace.png" alt="PPA Market Place">
  <div class="loading-text">Sebentar ya, toko-tokonya lagi disiapin...</div>
</div>

<header class="wrap">
  <div class="header-row">
    <img class="site-logo" src="images/logo-ppamarketplace.png" alt="PPA Market Place">
    <div class="site-title">PPA Market Place</div>
    <span class="header-stats" id="stats-strip"></span>
    <a class="daftar-btn" href="https://forms.gle/h5UnJox6Ep1h5pG17" target="_blank" rel="noopener">Daftar jualan di sini</a>
  </div>
</header>

<main class="wrap">

  <div id="view-home">

    <section class="hero">
      <h1 class="hero-title" id="mood-question">Moodnya lagi pengen apa nih?</h1>
      <p class="hero-sub">Jajanan &amp; jasa warga PPA, tinggal chat WhatsApp</p>
      <div class="mood-options" id="mood-options"></div>
    </section>

    <div class="filter-bar">
      <input type="text" id="search" placeholder="Cari nama usaha...">
      <button type="button" class="icon-btn" id="fav-filter">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.3-9.3-8.2C.8 9.8 1.8 6 5 5c2-.6 3.8.3 5 2 1.2-1.7 3-2.6 5-2 3.2 1 4.2 4.8 2.3 7.8C18.7 16.7 12 21 12 21z"/></svg>
        Favorit saya
      </button>
      <button type="button" class="icon-btn" id="shuffle-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        Acak
      </button>
    </div>

    <div class="kategori-row" id="kategori-chips"></div>

    <p class="filter-count" id="count"></p>

    <div id="grid" class="grid"></div>
  </div>

  <div id="view-detail" class="hidden"></div>

</main>

<footer class="wrap">
  Marketplace warga PPA. Dikelola secara mandiri, bukan aplikasi resmi jual beli.
</footer>

<script>
  let sellers = [];
  let displayOrder = [];
  let selectedMood = '';
  let selectedKategori = '';
  let favOnly = false;

  const FAV_KEY = 'ppa_marketplace_favorit';

  function getFavorit(){
    try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; }
    catch(e){ return []; }
  }
  function isFavorit(id){ return getFavorit().includes(id); }
  function toggleFavorit(id){
    const list = getFavorit();
    const idx = list.indexOf(id);
    if (idx === -1) list.push(id); else list.splice(idx, 1);
    localStorage.setItem(FAV_KEY, JSON.stringify(list));
    return list.includes(id);
  }

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function waLink(nomor){
    const bersih = String(nomor).replace(/[^0-9]/g, '');
    return `https://wa.me/${bersih}`;
  }

  function initial(nama){
    return (nama || '?').trim().charAt(0).toUpperCase();
  }

  const palet = [
    { soft: 'var(--pink-soft)', ink: 'var(--pink-ink)' },
    { soft: 'var(--cyan-soft)', ink: 'var(--cyan-ink)' },
    { soft: 'var(--amber-soft)', ink: 'var(--amber-ink)' },
    { soft: 'var(--green-soft)', ink: 'var(--green-ink)' }
  ];

  function warnaKategori(kat){
    if (!kat) return palet[1];
    let h = 0;
    for (let i = 0; i < kat.length; i++) h = (h * 31 + kat.charCodeAt(i)) >>> 0;
    return palet[h % palet.length];
  }

  const kategoriEmoji = {
    'snack': '🍿', 'makanan': '🍽️', 'minuman': '🥤', 'kopi': '☕',
    'jasa': '🛠️', 'sehat': '🥗', 'cemilan': '🍡'
  };
  function emojiFor(map, key){
    return map[(key || '').toLowerCase()] || '🏷️';
  }

  function ramaiBadge(){
    return `<span class="badge-ramai"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-1 4.5-2 6-1.5 2-2 3.5-2 5a4 4 0 0 0 8 0c0-1-.3-1.8-1-2.5.7 2-.3 3.5-1.5 3.5S12 12.5 12.7 11c1-2 1.8-4 1.3-6C17 6.5 19 9 19 13a7 7 0 1 1-14 0c0-4.5 3-7.5 7-11z"/></svg>Lagi Ramai</span>`;
  }

  const BARU_GABUNG_HARI = 14;

  function isBaruGabung(s){
    if (!s.gabung) return false;
    const tglGabung = new Date(s.gabung + 'T00:00:00');
    if (isNaN(tglGabung)) return false;
    const selisihHari = (Date.now() - tglGabung.getTime()) / (1000 * 60 * 60 * 24);
    return selisihHari >= 0 && selisihHari <= BARU_GABUNG_HARI;
  }

  function baruBadge(){
    return `<span class="badge-baru"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17l-5.5 4L8 13.5 3 9l6.5-.5z"/></svg>Baru Gabung</span>`;
  }

  function badgeStackHTML(s){
    const badges = [s.ramai ? ramaiBadge() : '', isBaruGabung(s) ? baruBadge() : ''].filter(Boolean).join('');
    return badges ? `<div class="badge-stack">${badges}</div>` : '';
  }

  function heartIcon(active){
    return `<svg viewBox="0 0 24 24" fill="${active ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-6.7-4.3-9.3-8.2C.8 9.8 1.8 6 5 5c2-.6 3.8.3 5 2 1.2-1.7 3-2.6 5-2 3.2 1 4.2 4.8 2.3 7.8C18.7 16.7 12 21 12 21z"/></svg>`;
  }

  function favBtnHTML(id){
    const active = isFavorit(id);
    return `<button type="button" class="fav-btn${active ? ' active' : ''}" data-fav-id="${id}" aria-label="Simpan sebagai favorit">${heartIcon(active)}</button>`;
  }

  function shareIconSVG(){
    return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>`;
  }

  function shareSeller(s){
    const url = `${location.origin}${location.pathname}#/seller/${encodeURIComponent(s.id)}`;
    const text = `Cek ${s.nama} di PPA Market Place: ${url}`;
    if (navigator.share){
      navigator.share({ title: s.nama, text, url }).catch(() => {});
    } else if (navigator.clipboard){
      navigator.clipboard.writeText(url).then(() => alert('Link toko disalin ke clipboard.'));
    } else {
      prompt('Salin link toko ini:', url);
    }
  }

  function bindLazyBlur(container){
    container.querySelectorAll('img.blur-load').forEach(img => {
      if (img.complete){ img.classList.remove('blur-load'); return; }
      img.addEventListener('load', () => img.classList.remove('blur-load'), { once: true });
    });
  }

  function renderSkeletons(container, n){
    container.innerHTML = '';
    for (let i = 0; i < n; i++){
      const el = document.createElement('div');
      el.className = 'skeleton-card';
      el.innerHTML = `
        <div class="skel skel-photo"></div>
        <div class="skel-body">
          <div class="skel skel-line w60"></div>
          <div class="skel skel-line w40"></div>
          <div class="skel skel-btn"></div>
        </div>`;
      container.appendChild(el);
    }
  }

  function renderCard(s){
    const foto = Array.isArray(s.foto) ? s.foto.filter(Boolean) : [];
    const warna = warnaKategori(s.kategori);

    let photosHTML;
    if (foto.length > 0){
      photosHTML = `
        <div class="track">
          ${foto.map((src, i) => `<img class="blur-load" src="${src}" alt="${s.nama}" loading="${i === 0 ? 'eager' : 'lazy'}">`).join('')}
        </div>
        ${foto.length > 1 ? `
          <button class="nav prev" aria-label="Sebelumnya">‹</button>
          <button class="nav next" aria-label="Berikutnya">›</button>
        ` : ''}
      `;
    } else {
      photosHTML = `<div class="no-photo" style="background:${warna.soft};color:${warna.ink}">Belum ada foto produk</div>`;
    }

    const logoHTML = s.logo
      ? `<img class="card-logo" src="${s.logo}" alt="Logo ${s.nama}" style="border-color:${warna.soft}" onerror="this.outerHTML='<div class=\\'card-logo fallback\\'>${initial(s.nama)}</div>'">`
      : `<div class="card-logo fallback">${initial(s.nama)}</div>`;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-photos">${badgeStackHTML(s)}${favBtnHTML(s.id)}${photosHTML}</div>
      <div class="card-body">
        <div class="card-top">
          ${logoHTML}
          <div>
            <div class="card-name">${s.nama || 'Tanpa nama'}</div>
            ${s.kategori ? `<span class="card-tag" style="background:${warna.soft};color:${warna.ink}">${emojiFor(kategoriEmoji, s.kategori)} ${s.kategori}</span>` : ''}
          </div>
        </div>
        ${s.deskripsi ? `<div class="card-desc">${s.deskripsi}</div>` : ''}
        <div class="card-actions">
          <a class="card-wa" href="${waLink(s.whatsapp)}" target="_blank" rel="noopener"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;margin-right:5px;"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.14c-.24.68-1.19 1.25-1.95 1.41-.52.11-1.2.2-3.48-.75-2.92-1.21-4.8-4.17-4.95-4.36-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.57.81 1.98.88 2.12.07.15.12.32.02.51-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.13-.29.28-.12.55.16.27.72 1.19 1.55 1.93 1.06.95 1.96 1.24 2.23 1.38.27.14.43.12.59-.07.16-.19.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.55.73 1.81.86.27.14.45.2.51.32.06.11.06.65-.18 1.33z"/></svg>Chat via WhatsApp</a>
          <button type="button" class="card-share" aria-label="Bagikan toko">${shareIconSVG()}</button>
        </div>
      </div>
    `;

    const track = card.querySelector('.track');
    const prev = card.querySelector('.prev');
    const next = card.querySelector('.next');
    const waBtn = card.querySelector('.card-wa');
    const shareBtn = card.querySelector('.card-share');
    const favBtn = card.querySelector('.fav-btn');

    if (track && prev && next){
      prev.addEventListener('click', e => { e.stopPropagation(); track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }); });
      next.addEventListener('click', e => { e.stopPropagation(); track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }); });
    }
    if (waBtn) waBtn.addEventListener('click', e => e.stopPropagation());
    if (shareBtn) shareBtn.addEventListener('click', e => { e.stopPropagation(); shareSeller(s); });
    if (favBtn){
      favBtn.addEventListener('click', e => {
        e.stopPropagation();
        const active = toggleFavorit(s.id);
        favBtn.classList.toggle('active', active);
        favBtn.innerHTML = heartIcon(active);
        if (favOnly) applyFilter();
      });
    }

    card.addEventListener('click', () => {
      window.location.hash = `#/seller/${encodeURIComponent(s.id)}`;
    });

    bindLazyBlur(card);

    return card;
  }

  function renderEmpty(container, ada){
    if (ada){
      container.innerHTML = `
        <div class="empty">
          <div class="empty-emoji">🔍</div>
          <p class="empty-title">Belum ketemu yang cocok</p>
          <p>Coba kata kunci lain atau ganti kategori/mood-nya.</p>
        </div>`;
    } else {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-emoji">🛍️</div>
          <p class="empty-title">Belum ada yang buka lapak di sini</p>
          <p>Jadi yang pertama — daftarkan usahamu, gratis.</p>
          <a class="empty-cta" href="https://forms.gle/h5UnJox6Ep1h5pG17" target="_blank" rel="noopener">Daftar jualan di sini</a>
        </div>`;
    }
  }

  function applyFilter(){
    const kw = document.getElementById('search').value.trim().toLowerCase();

    const hasil = displayOrder.filter(s => {
      const cocokKw = !kw || (s.nama || '').toLowerCase().includes(kw);
      const cocokKat = !selectedKategori || s.kategori === selectedKategori;
      const cocokMood = !selectedMood || (Array.isArray(s.tag) && s.tag.includes(selectedMood));
      const cocokFav = !favOnly || isFavorit(s.id);
      return cocokKw && cocokKat && cocokMood && cocokFav;
    });

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    document.getElementById('count').textContent = sellers.length
      ? `${hasil.length} dari ${sellers.length} usaha`
      : '';

    if (hasil.length === 0){
      renderEmpty(grid, sellers.length > 0);
      return;
    }
    hasil.forEach(s => grid.appendChild(renderCard(s)));
  }

  function isiStats(){
    const el = document.getElementById('stats-strip');
    if (sellers.length === 0){ el.textContent = ''; return; }
    const jumlahKategori = new Set(sellers.map(s => s.kategori).filter(Boolean)).size;
    el.textContent = `${sellers.length} usaha · ${jumlahKategori} kategori`;
  }

  function isiKategoriChips(){
    const box = document.getElementById('kategori-chips');
    const list = [...new Set(sellers.map(s => s.kategori).filter(Boolean))].sort();
    if (list.length === 0){ box.classList.add('hidden'); return; }

    const semuaBtn = document.createElement('button');
    semuaBtn.type = 'button';
    semuaBtn.className = 'kat-chip active';
    semuaBtn.dataset.kat = '';
    semuaBtn.textContent = '🏷️ Semua';
    box.appendChild(semuaBtn);

    list.forEach(k => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'kat-chip';
      btn.dataset.kat = k;
      btn.textContent = `${emojiFor(kategoriEmoji, k)} ${k}`;
      box.appendChild(btn);
    });

    box.addEventListener('click', e => {
      const btn = e.target.closest('.kat-chip');
      if (!btn) return;
      selectedKategori = btn.dataset.kat;
      box.querySelectorAll('.kat-chip').forEach(c => c.classList.toggle('active', c === btn));
      applyFilter();
    });
  }

  const moodQuestions = [
    'Moodnya lagi pengen apa nih?',
    'Lagi pengen jajan apa hari ini?',
    'Mau icip-icip yang mana dulu?',
    'Kira-kira pengen ngemil apa sekarang?',
    'Hari ini enaknya jajan yang mana ya?'
  ];

  const moodEmoji = {
    'manis': '🍬', 'gurih': '🍗', 'pedas': '🌶️', 'minuman': '🥤',
    'makanan': '🍽️', 'kopi': '☕', 'snack': '🍿', 'cemilan': '🍡',
    'sehat': '🥗', 'jasa': '🛠️'
  };

  function isiMood(){
    const heading = document.getElementById('mood-question');
    heading.textContent = moodQuestions[Math.floor(Math.random() * moodQuestions.length)];

    const box = document.getElementById('mood-options');
    const semuaTag = sellers.flatMap(s => Array.isArray(s.tag) ? s.tag : []);
    const tagUnik = [...new Set(semuaTag)].sort();

    if (tagUnik.length === 0){
      document.querySelector('.hero').classList.add('hidden');
      return;
    }

    box.innerHTML = '';
    tagUnik.forEach(t => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mood-chip';
      btn.dataset.tag = t;
      btn.textContent = `${emojiFor(moodEmoji, t)} ${t}`;
      btn.addEventListener('click', () => {
        selectedMood = (selectedMood === t) ? '' : t;
        box.querySelectorAll('.mood-chip').forEach(c => {
          c.classList.toggle('active', c.dataset.tag === selectedMood);
        });
        applyFilter();
      });
      box.appendChild(btn);
    });
  }

  function renderDetail(id){
    const s = sellers.find(x => x.id === id);
    const detail = document.getElementById('view-detail');

    if (!s){
      detail.innerHTML = `
        <a class="back-link" href="#/">← Kembali ke beranda</a>
        <div class="empty"><p>Toko tidak ditemukan.</p></div>
      `;
      return;
    }

    const warna = warnaKategori(s.kategori);
    const semuaFoto = Array.isArray(s.foto) ? s.foto.filter(Boolean) : [];
    const tags = [s.kategori, ...(Array.isArray(s.tag) ? s.tag : [])].filter(Boolean);
    let galleryHTML;
    if (semuaFoto.length > 0){
      galleryHTML = `
        <div class="detail-photos" style="background:${warna.soft}">
          ${badgeStackHTML(s)}
          ${favBtnHTML(s.id)}
          <div class="track" id="detail-track">
            ${semuaFoto.map((src, i) => `<img class="blur-load" src="${src}" alt="${s.nama}" loading="${i === 0 ? 'eager' : 'lazy'}">`).join('')}
          </div>
          ${semuaFoto.length > 1 ? `
            <button class="nav prev" id="detail-prev" aria-label="Sebelumnya">‹</button>
            <button class="nav next" id="detail-next" aria-label="Berikutnya">›</button>
            <div class="dots">
              ${semuaFoto.map((_, i) => `<span class="dot${i === 0 ? ' active' : ''}"></span>`).join('')}
            </div>
          ` : ''}
        </div>
      `;
    } else {
      galleryHTML = `<div class="detail-photos" style="background:${warna.soft};color:${warna.ink}">${badgeStackHTML(s)}${favBtnHTML(s.id)}<div class="no-photo">Belum ada foto katalog</div></div>`;
    }

    const logoHTML = s.logo
      ? `<img class="detail-logo" src="${s.logo}" alt="Logo ${s.nama}" style="border-color:${warna.soft}" onerror="this.outerHTML='<div class=\\'detail-logo fallback\\'>${initial(s.nama)}</div>'">`
      : `<div class="detail-logo fallback">${initial(s.nama)}</div>`;

    detail.innerHTML = `
      <a class="back-link" href="#/">← Kembali ke beranda</a>
      ${galleryHTML}
      <div class="detail-head">
        ${logoHTML}
        <div>
          <h1>${s.nama || 'Tanpa nama'}</h1>
          <div class="chip-row">${tags.map(t => `<span class="card-tag" style="background:${warna.soft};color:${warna.ink}">${t}</span>`).join('')}</div>
        </div>
      </div>
      ${s.deskripsi ? `<p class="detail-desc">${s.deskripsi}</p>` : ''}
      <div class="detail-actions">
        <a class="detail-wa" href="${waLink(s.whatsapp)}" target="_blank" rel="noopener"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;margin-right:5px;"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.14c-.24.68-1.19 1.25-1.95 1.41-.52.11-1.2.2-3.48-.75-2.92-1.21-4.8-4.17-4.95-4.36-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.01-2.41.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.41-.07.64.49.24.57.81 1.98.88 2.12.07.15.12.32.02.51-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.13-.29.28-.12.55.16.27.72 1.19 1.55 1.93 1.06.95 1.96 1.24 2.23 1.38.27.14.43.12.59-.07.16-.19.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.55.73 1.81.86.27.14.45.2.51.32.06.11.06.65-.18 1.33z"/></svg>Chat via WhatsApp</a>
        <button type="button" class="detail-icon-btn" id="detail-share" aria-label="Bagikan toko">${shareIconSVG()}</button>
      </div>
    `;

    const track = document.getElementById('detail-track');
    const prev = document.getElementById('detail-prev');
    const next = document.getElementById('detail-next');
    const dots = detail.querySelectorAll('.dot');
    const shareBtn = document.getElementById('detail-share');
    const favBtn = detail.querySelector('.fav-btn');

    if (track && prev && next){
      prev.addEventListener('click', () => track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }));
      next.addEventListener('click', () => track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }));
      track.addEventListener('scroll', () => {
        const idx = Math.round(track.scrollLeft / track.clientWidth);
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      });
    }
    if (shareBtn) shareBtn.addEventListener('click', () => shareSeller(s));
    if (favBtn){
      favBtn.addEventListener('click', () => {
        const active = toggleFavorit(s.id);
        favBtn.classList.toggle('active', active);
        favBtn.innerHTML = heartIcon(active);
      });
    }

    bindLazyBlur(detail);
  }

  function router(){
    const match = window.location.hash.match(/^#\/seller\/(.+)$/);
    const home = document.getElementById('view-home');
    const detail = document.getElementById('view-detail');

    if (match){
      renderDetail(decodeURIComponent(match[1]));
      home.classList.add('hidden');
      detail.classList.remove('hidden');
    } else {
      detail.classList.add('hidden');
      home.classList.remove('hidden');
    }
    window.scrollTo(0, 0);
  }

  const SPLASH_MIN = 700;
  const SPLASH_MAX = 2500;
  const splashStart = Date.now();
  let splashFaded = false;

  function fadeSplash(){
    if (splashFaded) return;
    splashFaded = true;
    const loader = document.getElementById('loading-screen');
    if (!loader) return;
    loader.classList.add('fade-out');
    setTimeout(() => { loader.style.display = 'none'; }, 400);
  }

  renderSkeletons(document.getElementById('grid'), 6);
  setTimeout(fadeSplash, SPLASH_MAX);

  fetch('data/sellers.json')
    .then(res => res.json())
    .then(data => {
      sellers = Array.isArray(data) ? data : [];
      displayOrder = shuffle(sellers);
      isiKategoriChips();
      isiMood();
      isiStats();
      applyFilter();
      router();
      const sisaWaktu = Math.max(0, SPLASH_MIN - (Date.now() - splashStart));
      setTimeout(fadeSplash, sisaWaktu);
    })
    .catch(() => {
      sellers = [];
      renderEmpty(document.getElementById('grid'), false);
      fadeSplash();
    });

  document.getElementById('search').addEventListener('input', applyFilter);
  document.getElementById('shuffle-btn').addEventListener('click', () => {
    displayOrder = shuffle(sellers);
    applyFilter();
  });
  document.getElementById('fav-filter').addEventListener('click', e => {
    favOnly = !favOnly;
    e.currentTarget.classList.toggle('active', favOnly);
    applyFilter();
  });
  window.addEventListener('hashchange', router);
</script>

</body>
</html>
