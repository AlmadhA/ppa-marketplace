<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPA Market Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  /* ================================================================
     WARNA & SKEMA DASAR (WARNA MIE GACOAN)
     ================================================================ */

  :root{
    --bg: #fcfcfb;
    --ink: #1a1a1e;
    --ink-soft: #74747c;
    --line: #e6e6ea;
    --card-bg: #ffffff;
    --pink: #e31c7f;
    --pink-dark: #b91367;
    --cyan: #14a7c9;
    --cyan-soft: #e4f6fa;
    --cyan-ink: #0d7a93;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
  }

  a{ color: inherit; }

  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ---------- Loading Screen Overlay ---------- */

  #loading-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  #loading-screen.fade-out {
    opacity: 0;
    visibility: hidden;
  }

  .loading-logo {
    width: 90px;
    height: auto;
    max-height: 90px;
    object-fit: contain;
    animation: pulse 1.5s infinite ease-in-out;
  }

  .loading-text {
    margin-top: 20px;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    text-align: center;
    padding: 0 20px;
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 0.9; }
  }

  /* ---------- Header ---------- */

  header{
    border-bottom: 1px solid var(--line);
    padding: 20px 0;
  }

  .header-row{
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .site-logo{
    width: auto;
    height: 52px;
    max-width: 140px;
    flex-shrink: 0;
    object-fit: contain;
    border-radius: 0;
    background: transparent;
  }

  .site-title h1{
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 25px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .site-title p{
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 14.5px;
  }

  .daftar-btn{
    margin-left: auto;
    text-decoration: none;
    background: var(--ink);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14.5px;
    font-weight: 500;
    white-space: nowrap;
  }

  .daftar-btn:hover{ background: var(--pink); }

  .hidden{ display: none !important; }

  /* ---------- Mood box ---------- */

  .mood-box{
    background: var(--cyan-soft);
    border-radius: 18px;
    padding: 20px 22px;
    margin-top: 22px;
  }

  .mood-box h2{
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 17px;
    margin: 0 0 12px;
    color: var(--ink);
  }

  .mood-options{
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .mood-chip{
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  .mood-chip.active{
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
  }

  /* ---------- Filter bar ---------- */

  .filter-bar{
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 20px 0;
    flex-wrap: wrap;
  }

  .filter-bar input,
  .filter-bar select{
    font-family: inherit;
    font-size: 14.5px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }

  .filter-bar input{ flex: 1; min-width: 180px; }

  .filter-count{
    color: var(--ink-soft);
    font-size: 13.5px;
    margin-left: auto;
  }

  /* ---------- Grid & Kartu Toko ---------- */

  main{ padding-bottom: 60px; }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 18px;
  }

  .card{
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card-bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 2px rgba(20,20,25,0.03);
    cursor: pointer;
  }

  .card-photos{
    position: relative;
    height: 180px;
    background: #111;
    overflow: hidden;
  }

  .card-photos .track{
    display: flex;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .card-photos .track::-webkit-scrollbar{ display: none; }

  .card-photos .track img{
    flex: 0 0 100%;
    scroll-snap-align: start;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .card-photos .nav{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(38,36,32,0.55);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .card-photos .nav.prev{ left: 8px; }
  .card-photos .nav.next{ right: 8px; }

  .card-photos .no-photo{
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cyan-ink);
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: var(--cyan-soft);
  }

  .card-body{
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  .card-top{
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-logo{
    width: 38px;
    height: 38px;
    border-radius: 8px;
    object-fit: cover;
    background-color: #f0f0f0;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }

  .card-logo.fallback{
    background: linear-gradient(135deg, var(--pink), var(--cyan));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 14px;
  }

  .card-name{ font-weight: 600; font-size: 15.5px; }

  .card-tag{
    font-size: 12.5px;
    color: var(--cyan-ink);
    background: var(--cyan-soft);
    padding: 2px 9px;
    border-radius: 999px;
    display: inline-block;
    width: fit-content;
    font-weight: 500;
  }

  .card-desc{
    font-size: 13.5px;
    color: var(--ink-soft);
    flex: 1;
  }

  .card-wa{
    text-decoration: none;
    text-align: center;
    background: var(--pink);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 0;
    border-radius: 8px;
  }

  .card-wa:hover{ background: var(--pink-dark); }

  /* ---------- Halaman Detail Seller ---------- */

  .back-link{
    display: inline-block;
    text-decoration: none;
    color: var(--ink-soft);
    font-size: 14px;
    margin: 22px 0 16px;
  }

  .back-link:hover{ color: var(--pink); }

  .detail-photos{
    position: relative;
    width: 100%;
    height: 480px;
    border-radius: 16px;
    overflow: hidden;
    background: #111111;
  }

  .detail-photos .track{
    display: flex;
    height: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .detail-photos .track::-webkit-scrollbar{ display: none; }

  .detail-photos .track img{
    flex: 0 0 100%;
    scroll-snap-align: start;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
  }

  .detail-photos .no-photo{
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cyan-ink);
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    background: var(--cyan-soft);
  }

  .detail-photos .dots{
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 6px;
    z-index: 2;
  }

  .detail-photos .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
  }

  .detail-photos .dot.active{ background: #fff; }

  .detail-head{
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
  }

  .detail-logo{
    width: 60px;
    height: 60px;
    border-radius: 12px;
    object-fit: cover;
    background-color: #f0f0f0;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }

  .detail-logo.fallback{
    background: linear-gradient(135deg, var(--pink), var(--cyan));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 20px;
  }

  .detail-head h1{
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 6px;
  }

  .chip-row{
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .detail-desc{
    font-size: 15px;
    color: var(--ink-soft);
    margin: 18px 0;
  }

  .detail-wa{
    display: inline-block;
    text-decoration: none;
    text-align: center;
    background: var(--pink);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 28px;
    border-radius: 999px;
    margin-bottom: 40px;
  }

  .detail-wa:hover{ background: var(--pink-dark); }

  /* ---------- Empty state ---------- */

  .empty{
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 50px 20px;
    text-align: center;
    color: var(--ink-soft);
  }

  .empty p{ margin: 6px 0; }

  .empty a{ color: var(--cyan-ink); font-weight: 500; }

  /* ---------- Footer ---------- */

  footer{
    border-top: 1px solid var(--line);
    padding: 22px 0;
    color: var(--ink-soft);
    font-size: 13px;
  }

  @media (max-width: 480px){
    .daftar-btn{ margin-left: 0; }
    .site-title h1{ font-size: 22px; }
    .detail-photos{ height: 400px; }
  }
</style>
</head>
<body>

<!-- LAYAR LOADING WELCOME -->
<div id="loading-screen">
  <img class="loading-logo" src="images/logo-ppamarketplace.png" alt="PPA Marketplace Logo">
  <div class="loading-text">Sebentar ya toko-tokonya lagi disiapin...</div>
</div>

<header class="wrap">
  <div class="header-row">
    <img class="site-logo" src="images/logo-ppamarketplace.png" alt="PPA Market Place">

    <div class="site-title">
      <h1>PPA Market Place</h1>
      <p>Tempat warga PPA memperkenalkan usahanya</p>
    </div>

    <a class="daftar-btn" href="#" target="_blank" rel="noopener">Daftar jualan di sini</a>
  </div>
</header>

<main class="wrap">

  <div id="view-home">
    <section class="mood-box">
      <h2 id="mood-question">Moodnya lagi pengen apa nih?</h2>
      <div class="mood-options" id="mood-options"></div>
    </section>

    <div class="filter-bar">
      <input type="text" id="search" placeholder="Cari nama usaha...">
      <select id="kategori">
        <option value="">Semua kategori</option>
      </select>
      <span class="filter-count" id="count"></span>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <div id="view-detail" class="hidden"></div>

</main>

<footer class="wrap">
  Marketplace warga PPA. Dikelola secara mandiri, bukan aplikasi resmi jual beli.
</footer>

<script>
  let sellers = [];
  const MIN_LOADING_TIME = 3500; // Minimal durasi loading: 3.5 detik (3500 md)
  const startTime = Date.now();

  function hideLoadingScreen() {
    const elapsedTime = Date.now() - startTime;
    const remainingTime = Math.max(0, MIN_LOADING_TIME - elapsedTime);

    // Menunggu sisa waktu hingga genap minimal 3.5 detik
    setTimeout(() => {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500);
      }
    }, remainingTime);
  }

  function preloadImages(imageUrls) {
    if (!imageUrls || imageUrls.length === 0) {
      return Promise.resolve();
    }
    const promises = imageUrls.map(url => {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = url;
        img.onload = resolve;
        img.onerror = resolve;
      });
    });
    return Promise.all(promises);
  }

  function waLink(nomor){
    const bersih = String(nomor).replace(/[^0-9]/g, '');
    return `https://wa.me/${bersih}`;
  }

  function initial(nama){
    return (nama || '?').trim().charAt(0).toUpperCase();
  }

  function renderCard(s){
    const foto = Array.isArray(s.foto) ? s.foto.filter(Boolean) : [];

    let photosHTML;
    if (foto.length > 0){
      photosHTML = `
        <div class="track">
          ${foto.map(src => `<img src="${src}" alt="${s.nama}" loading="lazy">`).join('')}
        </div>
        ${foto.length > 1 ? `
          <button class="nav prev" aria-label="Sebelumnya">‹</button>
          <button class="nav next" aria-label="Berikutnya">›</button>
        ` : ''}
      `;
    } else {
      photosHTML = `<div class="no-photo">Belum ada foto produk</div>`;
    }

    const logoHTML = s.logo
      ? `<img class="card-logo" src="${s.logo}" alt="Logo ${s.nama}" onerror="this.outerHTML='<div class=\\'card-logo fallback\\'>${initial(s.nama)}</div>'">`
      : `<div class="card-logo fallback">${initial(s.nama)}</div>`;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-photos">${photosHTML}</div>
      <div class="card-body">
        <div class="card-top">
          ${logoHTML}
          <div>
            <div class="card-name">${s.nama || 'Tanpa nama'}</div>
            ${s.kategori ? `<span class="card-tag">${s.kategori}</span>` : ''}
          </div>
        </div>
        ${s.deskripsi ? `<div class="card-desc">${s.deskripsi}</div>` : ''}
        <a class="card-wa" href="${waLink(s.whatsapp)}" target="_blank" rel="noopener">Chat via WhatsApp</a>
      </div>
    `;

    const track = card.querySelector('.track');
    const prev = card.querySelector('.prev');
    const next = card.querySelector('.next');
    const waBtn = card.querySelector('.card-wa');

    if (track && prev && next){
      prev.addEventListener('click', e => { e.stopPropagation(); track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }); });
      next.addEventListener('click', e => { e.stopPropagation(); track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }); });
    }
    if (waBtn){
      waBtn.addEventListener('click', e => e.stopPropagation());
    }

    card.addEventListener('click', () => {
      window.location.hash = `#/seller/${encodeURIComponent(s.id)}`;
    });

    return card;
  }

  function renderEmpty(container, ada){
    const msg = ada
      ? '<p>Tidak ada usaha yang cocok dengan pencarian ini.</p>'
      : '<p>Belum ada yang buka lapak di sini.</p><p>Jadi yang pertama — isi form pendaftaran di atas.</p>';
    container.innerHTML = `<div class="empty">${msg}</div>`;
  }

  let selectedMood = '';

  function applyFilter(){
    const kw = document.getElementById('search').value.trim().toLowerCase();
    const kat = document.getElementById('kategori').value;

    const hasil = sellers.filter(s => {
      const cocokKw = !kw || (s.nama || '').toLowerCase().includes(kw);
      const cocokKat = !kat || s.kategori === kat;
      const cocokMood = !selectedMood || (Array.isArray(s.tag) && s.tag.includes(selectedMood));
      return cocokKw && cocokKat && cocokMood;
    });

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    document.getElementById('count').textContent = sellers.length
      ? `${hasil.length} dari ${sellers.length} usaha`
      : '';

    if (hasil.length === 0){
      renderEmpty(grid, sellers.length > 0);
      return;
    }
    hasil.forEach(s => grid.appendChild(renderCard(s)));
  }

  function isiKategori(){
    const select = document.getElementById('kategori');
    const kategoriUnik = [...new Set(sellers.map(s => s.kategori).filter(Boolean))].sort();
    kategoriUnik.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = k;
      select.appendChild(opt);
    });
  }

  const moodQuestions = [
    'Moodnya lagi pengen apa nih?',
    'Lagi pengen jajan apa hari ini?',
    'Mau icip-icip yang mana dulu?',
    'Kira-kira pengen ngemil apa sekarang?',
    'Hari ini enaknya jajan yang mana ya?'
  ];

  function isiMood(){
    const heading = document.getElementById('mood-question');
    heading.textContent = moodQuestions[Math.floor(Math.random() * moodQuestions.length)];

    const box = document.getElementById('mood-options');
    const semuaTag = sellers.flatMap(s => Array.isArray(s.tag) ? s.tag : []);
    const tagUnik = [...new Set(semuaTag)].sort();

    if (tagUnik.length === 0){
      document.querySelector('.mood-box').classList.add('hidden');
      return;
    }

    box.innerHTML = '';
    tagUnik.forEach(t => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mood-chip';
      btn.textContent = t;
      btn.addEventListener('click', () => {
        selectedMood = (selectedMood === t) ? '' : t;
        box.querySelectorAll('.mood-chip').forEach(c => {
          c.classList.toggle('active', c.textContent === selectedMood);
        });
        applyFilter();
      });
      box.appendChild(btn);
    });
  }

  function renderDetail(id){
    const s = sellers.find(x => x.id === id);
    const detail = document.getElementById('view-detail');

    if (!s){
      detail.innerHTML = `
        <a class="back-link" href="#/">← Kembali ke beranda</a>
        <div class="empty"><p>Toko tidak ditemukan.</p></div>
      `;
      return;
    }

    const semuaFoto = Array.isArray(s.foto) ? s.foto.filter(Boolean) : [];
    const tags = [s.kategori, ...(Array.isArray(s.tag) ? s.tag : [])].filter(Boolean);

    let galleryHTML;
    if (semuaFoto.length > 0){
      galleryHTML = `
        <div class="detail-photos">
          <div class="track" id="detail-track">
            ${semuaFoto.map(src => `<img src="${src}" alt="${s.nama}">`).join('')}
          </div>
          ${semuaFoto.length > 1 ? `
            <button class="nav prev" id="detail-prev" aria-label="Sebelumnya">‹</button>
            <button class="nav next" id="detail-next" aria-label="Berikutnya">›</button>
            <div class="dots">
              ${semuaFoto.map((_, i) => `<span class="dot${i === 0 ? ' active' : ''}"></span>`).join('')}
            </div>
          ` : ''}
        </div>
      `;
    } else {
      galleryHTML = `<div class="detail-photos"><div class="no-photo">Belum ada foto katalog</div></div>`;
    }

    const logoHTML = s.logo
      ? `<img class="detail-logo" src="${s.logo}" alt="Logo ${s.nama}" onerror="this.outerHTML='<div class=\\'detail-logo fallback\\'>${initial(s.nama)}</div>'">`
      : `<div class="detail-logo fallback">${initial(s.nama)}</div>`;

    detail.innerHTML = `
      <a class="back-link" href="#/">← Kembali ke beranda</a>
      ${galleryHTML}
      <div class="detail-head">
        ${logoHTML}
        <div>
          <h1>${s.nama || 'Tanpa nama'}</h1>
          <div class="chip-row">${tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
        </div>
      </div>
      ${s.deskripsi ? `<p class="detail-desc">${s.deskripsi}</p>` : ''}
      <a class="detail-wa" href="${waLink(s.whatsapp)}" target="_blank" rel="noopener">Chat via WhatsApp</a>
    `;

    const track = document.getElementById('detail-track');
    const prev = document.getElementById('detail-prev');
    const next = document.getElementById('detail-next');
    const dots = detail.querySelectorAll('.dot');

    if (track && prev && next){
      prev.addEventListener('click', () => track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }));
      next.addEventListener('click', () => track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }));
      track.addEventListener('scroll', () => {
        const idx = Math.round(track.scrollLeft / track.clientWidth);
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      });
    }
  }

  function router(){
    const match = window.location.hash.match(/^#\/seller\/(.+)$/);
    const home = document.getElementById('view-home');
    const detail = document.getElementById('view-detail');

    if (match){
      renderDetail(decodeURIComponent(match[1]));
      home.classList.add('hidden');
      detail.classList.remove('hidden');
    } else {
      detail.classList.add('hidden');
      home.classList.remove('hidden');
    }
    window.scrollTo(0, 0);
  }

  fetch('data/sellers.json')
    .then(res => res.json())
    .then(data => {
      sellers = Array.isArray(data) ? data : [];
      isiKategori();
      isiMood();
      applyFilter();
      router();

      const fotoPreload = sellers.map(s => Array.isArray(s.foto) ? s.foto[0] : null).filter(Boolean);
      
      preloadImages(fotoPreload).then(() => {
        hideLoadingScreen();
      });
    })
    .catch(() => {
      renderEmpty(document.getElementById('grid'), false);
      hideLoadingScreen();
    });

  document.getElementById('search').addEventListener('input', applyFilter);
  document.getElementById('kategori').addEventListener('change', applyFilter);
  window.addEventListener('hashchange', router);
</script>

</body>
</html>
